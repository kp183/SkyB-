name: SkyB CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-checks:
    name: Backend Correctness Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Bytecode Compile Check
        run: |
          python -m compileall backend

      - name: Database Seed & Model Validation
        env:
          JWT_SECRET: "test_academic_secret_for_ci_checks"
        run: |
          python -m backend.seed

  frontend-checks:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Build & Type Check Next.js
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: |
          npm run build
